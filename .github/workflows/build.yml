# Build and test the runner.
#
# The check names below are the thing to be careful with. They are what the
# required set on the default branch refers to later, and a job renamed in
# passing removes itself from that set while the tab still looks green. Every
# job here carries an explicit `name:`, so the reported name comes from this
# file rather than from whatever the job id happens to be, and changing one is a
# change to the gate rather than tidying.
#
# The platforms come from docs/decisions/0012-the-supported-platforms.md and
# from nowhere else. That record names six entries for the build and three for
# the suite, and both halves are here. The three the suite runs on are the three
# that differ in what a checkout is, which is the whole of what the runner
# reads; the other three are compiled and produce no evidence beyond that the
# source builds.
#
# Hardened the way every other workflow in this tree is, because the audit job
# in zizmor.yml refuses a new one that departs from it: permissions are denied
# at the top and granted per job, every action is pinned to a commit with its
# version in a comment, and checkout does not persist credentials.
name: Build and test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Explicit deny-all at workflow level; each job grants only what it needs.
permissions: {}

# Cancel a superseded run on the same ref. Nothing here publishes, so a run that
# has been overtaken is safe to drop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One entry per platform the release targets. Cross-compiled from one runner
    # rather than one runner per platform: what this job answers is whether the
    # source compiles for that target, and the compiler answers that from
    # anywhere. Whether a hosted runner exists for each label is the question
    # record 0012 leaves to the first workflow written against it, and the suite
    # is where it gets settled, not here.
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Every entry runs. Stopping the matrix at the first failure would report
      # one broken platform and leave the others unexamined, which reads as
      # though only one is broken.
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain comes from go.mod, so the version this job uses moves
          # when the module says so and never separately.
          go-version-file: go.mod
          # This module has no dependencies and therefore no go.sum for a cache
          # key to be built from. Asking for a cache anyway makes the step
          # depend on a file that is not there.
          cache: false

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        # The two roots are the runner and nothing else. An experiment's code is
        # in this module and is deliberately outside this pattern, which is
        # record 0017 supplying the mechanism record 0009 decided the property
        # for. Widening this back to ./... puts a prototype somebody abandoned
        # half-written in front of six platforms it was never about.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/... ./internal/...

  test:
    # One entry per platform record 0012 says the release ships a binary for and
    # the suite runs on. Compiling for a platform is not the property that
    # matters most here: the runner's whole job is reading a checkout, and what
    # a checkout is differs between these three. Case folding, the path
    # separator and what a line ending arrives as are the three properties
    # record 0012 chose the list from, and each entry below differs from the
    # baseline in at least one of them.
    #
    # The label is not the platform. The names below are written from the
    # record's vocabulary rather than from the runner label, because the record
    # is what a reader is holding when they ask whether every entry is covered,
    # and which architecture a label carries is a property of an image rather
    # than of this file. Nothing here claims that pairing: the first step of the
    # job asks the toolchain and refuses the entry when the answer disagrees.
    #
    # Record 0012 leaves open whether a hosted runner is offered for each of
    # these and says the first workflow written against it settles that, since a
    # run either arrives on the label or does not. This job is that workflow.
    # The build matrix above never asked, because it cross-compiles.
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # Every platform runs. Stopping at the first failure would leave the other
      # two unexamined, and a checker whose whole job is reading a checkout is
      # the last thing to learn about on one platform at a time.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: windows/amd64
            runner: windows-latest
          - platform: darwin/arm64
            runner: macos-latest
    defaults:
      run:
        # One shell for all three entries, so the counting step below is one
        # script rather than three that have to be kept saying the same thing.
        # Every image these entries run on carries bash.
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Say which platform this entry ran on
        # The entry names a platform and the image decides what it actually is,
        # so this asks rather than assumes. An image that moves under its label
        # reddens the entry that claimed it instead of quietly running the suite
        # somewhere record 0012 already covers, which is the failure a sentence
        # in a comment could not catch. It also prints the answer, so a reader
        # asking which three platforms produced evidence reads it out of the run
        # rather than out of this file.
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          reported="$(go env GOOS)/$(go env GOARCH)"
          echo "${PLATFORM}: the toolchain here reports ${reported}"
          if [ "$reported" != "$PLATFORM" ]; then
            echo "::error::This entry is written as ${PLATFORM} and the toolchain reports ${reported}."
            exit 1
          fi

      - name: Run the default suite
        # The same suite on every entry. No platform gets a reduced set, because
        # the platform whose difficult tests are left out is the platform the
        # defect is on. The pattern is the runner's two roots on all three, and
        # what it leaves out is an experiment's code rather than any of the
        # runner's, which is record 0017.
        #
        # -count=1 rather than the cache, so a green entry is a suite that ran
        # on this machine rather than one whose stored output was replayed.
        #
        # The count is what separates a suite that ran everything and passed
        # from one that executed nothing and reported success, which look
        # identical from outside. Top-level results are counted: a subtest's
        # line is indented, so the anchored pattern does not read it twice.
        #
        # The platform reaches the script through the environment rather than
        # through an expression inside it, which is the pattern the other
        # workflows here already carry.
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          go test -count=1 -v ./cmd/... ./internal/... 2>&1 | tee suite.log
          executed=$(grep -cE '^--- (PASS|FAIL): ' suite.log || true)
          skipped=$(grep -cE '^--- SKIP: ' suite.log || true)
          echo "${PLATFORM}: executed ${executed} test(s), skipped ${skipped}"
          if [ "$executed" -eq 0 ]; then
            echo "::error::The suite reported success having executed no tests on ${PLATFORM}."
            exit 1
          fi
          # The run has to say what it did not cover. internal/hardware prints
          # one line when its harness was not asked for, saying so and what
          # asking would cost, and it is printed by a package that passes, so
          # it reaches the log only under -v. Dropping that flag, or losing the
          # disclosure, would leave a run that covered less than the whole set
          # looking exactly like one that covered it and found nothing. The
          # string is hardware.Disclosure()'s, and a reword there reddens this
          # rather than passing in silence.
          disclosed=$(grep -cF 'integration-hardware harness was not asked for' suite.log || true)
          if [ "$disclosed" -eq 0 ]; then
            echo "::error::The suite printed no integration-hardware disclosure on ${PLATFORM}, so this run covered less than the whole set without saying so."
            exit 1
          fi
          echo "${PLATFORM}: the integration-hardware disclosure was printed"

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet the runner
        # The step name and the pattern say the same thing now. Record 0017
        # keeps an experiment's code out of every command here, and vet is one
        # of them.
        run: go vet ./cmd/... ./internal/...

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        # gofmt -l prints the files it would change and exits zero either way,
        # so the job has to read the output to fail. Printing the names first
        # means a red run says which files rather than only that some file was
        # wrong.
        #
        # gofmt takes directories rather than a package pattern, so the two
        # roots are spelled the way it reads them. This is the one command here
        # that would fail on an experiment without compiling it: gofmt exits
        # non-zero on a file it cannot parse, and half-written is the ordinary
        # state of a prototype somebody abandoned. Record 0017 is where that is
        # argued.
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::These files are not gofmt-formatted. Run 'gofmt -w cmd internal'."
            exit 1
          fi
          echo "Every Go file the runner is built from is gofmt-formatted."
